    };
    const up=()=>{
      deck.setRate(base);
      window.removeEventListener('pointermove',move);
      window.removeEventListener('pointerup',up);
    };
    window.addEventListener('pointermove',move);
    window.addEventListener('pointerup',up);
  };

  const t=deck.track;
  const rot=(ui.pos*(deck.baseBpm?deck.baseBpm/60:2)*360)%360;
  const remain=deck.duration-ui.pos;
  // While SYNC is holding the deck, the drift corrector nudges the real rate
  // every 150ms, so show the live effective pitch (read off the engine) rather
  // than the stale value doSync wrote once. The 60ms UI tick re-reads it.
  const effPitch = ui.sync ? (deck.rate-1)*100 : pitch;

  return (
    <div className="deck">
      <div className="dhead">
        <div className="dbadge" style={{background:accent}}>{id}</div>
        <div className="tinfo">
          <div className="ttitle">{t?t.title:'— no track loaded —'}</div>
          <div className="tsub">
            {t? `${t.artist}` : 'drop an audio file anywhere'}
            {deck.track && ` · ${fmtTime(ui.pos)} / -${fmtTime(remain)}`}
          </div>
        </div>
        <div className="bpmbox">
          <div className="bpmval" style={{color:accent}}>
            {deck.bpm? deck.bpm.toFixed(1) : '--.-'}
          </div>
          <div className="bpmlbl">BPM</div>
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:3}}>
          <button className="mini" title="double the detected tempo"
                  onClick={()=>{ if(deck.scaleBpm(2)) applyGrid(deck.baseBpm, deck.beatOffset); }}>×2</button>
          <button className="mini" title="halve the detected tempo"
                  onClick={()=>{ if(deck.scaleBpm(0.5)) applyGrid(deck.baseBpm, deck.beatOffset); }}>÷2</button>
        </div>
        <div className="gridfix">
          <button className={'mini'+(tapCount?' on':'')}
                  style={tapCount?{background:accent,color:'#000',borderColor:accent}:null}
                  onClick={doTap} onDoubleClick={resetTaps} disabled={!deck.track}
                  title="tap along with the beat — four taps or more sets the tempo, and while the deck is playing it sets the grid's phase too. Double-click to start over.">
            TAP{tapCount?` ${tapCount}`:''}
          </button>
          <div style={{display:'flex',gap:3}}>
            <button className="mini" onClick={()=>nudgeGrid(-1)} disabled={!deck.track}
                    title="nudge the beat grid earlier">◀</button>
            <button className="mini" onClick={()=>nudgeGrid(1)} disabled={!deck.track}
                    title="nudge the beat grid later">▶</button>
          </div>
        </div>
      </div>

      <WaveMain deck={deck} accent={accent}/>
      <WaveNav deck={deck} accent={accent}/>

      <div className="dbody">
        <div className="platter-col">
          <div className="platter" ref={platterRef} onPointerDown={platterDown}>
            <div className="mark" style={{background:accent, transform:`rotate(${rot}deg)`}}/>
            <div className="hub"/>
          </div>
          <div className="hint">drag to nudge</div>
        </div>

        <div className="ctrls">
          <div className="row">
            <button className={'tbtn play'+(ui.playing?' on':'')}
                    onClick={()=>{deck.toggle();bump();}}>
              {ui.playing?'❚❚ PAUSE':'▶ PLAY'}
            </button>
            <button className="tbtn cue"
                    onPointerDown={()=>{ if(!deck.playing){deck.setCue();} deck.toCue(); deck.play(); bump(); }}
                    onPointerUp={()=>{ deck.pause(); deck.toCue(); bump(); }}>CUE</button>
            <button className={'tbtn sync'+(ui.sync?' on':'')} onClick={doSync}
                    style={syncFail?{background:'var(--red)',color:'#fff',borderColor:'var(--red)'}:null}
                    title={`match tempo to the other deck and keep it phase-locked (within ±${PITCH_RANGE}%)`}>
              {syncFail?'OUT OF RANGE':'SYNC'}
            </button>
            <button className={'tbtn'+(ui.slipping?' on':'')} onClick={()=>{ ui.slipping?deck.slipOff():deck.slipOn(); rerender(); }}
                    style={ui.slipping?{background:'var(--yel)',color:'#000',borderColor:'var(--yel)'}:null}
                    title="slip mode: seeks/hotcues/loops play a temporary detour — the real position keeps advancing underneath and playback snaps back to it when you turn slip off">
              SLIP
            </button>
          </div>

          <div className="row" style={{gap:6}}>
            <span className="hint" style={{alignSelf:'center'}}>HOTCUES</span>
            <button className={'mini'+(quantized?' on':'')}
                    style={quantized?{background:accent,color:'#000',borderColor:accent}:null}
                    onClick={toggleQuantize}
                    title="ON: hotcue/loop jumps snap to the next beat. OFF: jump immediately, mid-beat.">
              QUANT {quantized?'ON':'OFF'}
            </button>
          </div>

          <div className="cues">
            {deck.hotcues.map((c,i)=>(
              <button key={i} className={'hcue'+(c!=null?' set':'')}
                      style={c!=null?{background:CUE_COLORS[i],borderColor:CUE_COLORS[i]}:null}
                      onClick={(e)=>hotcue(i,e)}
                      title={c!=null?'click to jump · shift-click to clear':'click to set'}>
                {i+1}
              </button>
            ))}
          </div>

          <div className="loops">
            {[1,2,4,8].map(b=>(
              <button key={b}
                      className={'lbtn'+(deck.loop&&deck.loop.beats===b&&!deck.rolling?' on':'')}
                      onClick={()=>{ deck.loop&&deck.loop.beats===b?deck.clearLoop():deck.setLoop(b); rerender(); }}>
                {b}
              </button>
            ))}
            <button className="lbtn" onClick={()=>{deck.clearLoop();rerender();}}>✕</button>
          </div>

          <div className="loops" title="loop roll — hold for a momentary loop, release to snap back to where the track really is">
            {[0.25,0.5,1,2].map(b=>(
              <button key={b} className={'lbtn'+(ui.rolling&&deck.loop&&deck.loop.beats===b?' on':'')}
                      onPointerDown={()=>{deck.loopRollOn(b); rerender();}}
                      onPointerUp={()=>{deck.loopRollOff(); rerender();}}
                      onPointerLeave={()=>{ if(deck.rolling) deck.loopRollOff(); rerender(); }}>
                {b<1?'1/'+Math.round(1/b):b} ROLL
              </button>
            ))}
          </div>

          <div className="slicer" title={deck.loop?'loop slicer — jump to any of the 8 steps within the active loop':'loop slicer — set a loop (1/2/4/8 above) to slice it into 8 steps'}>
            {Array.from({length:8},(_,i)=>{
              const active=!!deck.loop;
              const stepLen=active ? (deck.loop.end-deck.loop.start)/8 : 0;
              const stepStart=active ? deck.loop.start+i*stepLen : 0;
              const isCurrent=active && ui.pos>=stepStart && ui.pos<stepStart+stepLen;
              return (
                <button key={i} className={'spad'+(isCurrent?' on':'')}
                        style={isCurrent?{background:accent,borderColor:accent}:null}
                        disabled={!active}
                        onClick={()=>{ deck.jumpTo(stepStart); rerender(); }}>
                  {i+1}
                </button>
              );
            })}
          </div>

          <div className="row" style={{gap:8,alignItems:'center'}}>
            <Knob label="FILTER" value={filter} min={-1} max={1} center
                  onChange={setFilterKnob} color={accent} size={40}
                  fmt={v=>v===0?'off':(v<0?'LP ':'HP ')+Math.round(Math.abs(v)*100)}/>
            <Knob label="FX" value={fx.amount} min={0} max={1}
                  onChange={setFxAmount} color={accent} size={40}
                  fmt={v=>Math.round(v*100)+'%'}/>
            <div style={{display:'flex',flexDirection:'column',gap:4}}>
              {['delay','reverb','flanger','phaser','echo'].map(ty=>(
                <button key={ty} className={'mini'+(fx.type===ty?' on':'')}
                        style={fx.type===ty?{background:accent,color:'#000',borderColor:accent}:null}
                        onClick={()=>setFxType(ty)}
                        title={ty===('delay')?'Delay (tempo-synced)':ty===('reverb')?'Reverb (spatial)':ty===('flanger')?'Flanger (sweep)':ty===('phaser')?'Phaser (notch filter)':'Echo (long delay)'}
                        >{ty.slice(0,3).toUpperCase()}</button>
              ))}
            </div>
          </div>
        </div>

        <div className="eqcol">
          <Knob label="HI" value={eq.high} min={-26} max={12} center color={accent}
                onChange={v=>setEqBand('high',v)} fmt={v=>v.toFixed(0)+'dB'} size={36}/>
          <Knob label="MID" value={eq.mid} min={-26} max={12} center color={accent}
                onChange={v=>setEqBand('mid',v)} fmt={v=>v.toFixed(0)+'dB'} size={36}/>
          <div title="mid band width — wide is a musical EQ move, narrow is a surgical notch">
            <Knob label="Q" value={midQ} min={0.3} max={8} color={accent}
                  onChange={setMidQKnob} fmt={v=>v.toFixed(1)} size={26}/>
          </div>
          <Knob label="LOW" value={eq.low} min={-26} max={12} center color={accent}
                onChange={v=>setEqBand('low',v)} fmt={v=>v.toFixed(0)+'dB'} size={36}/>

          <div className="fxslot">
            <div className="knoblbl">FX SLOT</div>
            <select className="fxsel" value={fxId} onChange={e=>{deck.stopFx();setFxLoop(0);setFxId(e.target.value);}}
                    style={fxItem&&fxItem.tag?{borderColor:TAG_COLORS[fxItem.tag]}:null}
                    title={fxItem?fxItem.title:'tag an FX file in the library to load it here'}>
              <option value="">— none —</option>
              {fxItems.map(t=>(
                <option key={t.id} value={t.id}>{t.tag?`[${t.tag[0]}] `:''}{t.title}</option>
              ))}
            </select>
            <button className="fxpad" onClick={fxOneShot} disabled={!fxItem}
                    title="one-shot — play the sample once, no loop">▶ ONE-SHOT</button>
            <div className="fxloops">
              {[1,2,4].map(b=>(
                <button key={b} className={'fxlbtn'+(fxLoop===b?' on':'')}
                        onClick={()=>fxLoopToggle(b)} disabled={!fxItem}
                        title={`loop the sample for ${b} beat${b>1?'s':''} (tap again to stop)`}>{b}</button>
              ))}
              <button className="fxlbtn" onClick={fxStop} disabled={!fxItem} title="stop FX">✕</button>
            </div>
          </div>
        </div>

        <div className="pitchwrap">
          <div className="knoblbl" style={{color:accent}}>
            {effPitch>0?'+':''}{effPitch.toFixed(1)}%
          </div>
          <input className="pitch" type="range" min={-PITCH_RANGE} max={PITCH_RANGE} step="0.02"
                 value={effPitch} onChange={e=>applyPitch(parseFloat(e.target.value))}/>
          <button className="mini" onClick={()=>applyPitch(0)}>RESET</button>
          <button className="mini" onClick={toggleKeylock}
                  style={keylock?{background:accent,color:'#000',borderColor:accent}:null}
                  title="ON: change tempo without shifting pitch (time-stretch). OFF: classic linked pitch/tempo, like vinyl.">
            KEY {keylock?'LOCK':'OFF'}
          </button>

          <Knob label="KEY" value={keySemis} min={-12} max={12} center color={accent} size={40}
                onChange={v=>applyKeyShift(Math.round(v))}
                fmt={v=>(v>0?'+':'')+v+' st'}/>
          <button className="mini" onClick={()=>applyKeyShift(0)}>RESET KEY</button>
        </div>
      </div>
    </div>
  );
});

/* ============================================================
   MIDI PANEL — mapping UI (list of controls, LEARN/clear per row)
   ============================================================ */
function MidiPanel({devices, map, learn, onLearn, onClear, onClearAll, onClose}){
  const fmtBinding=(b)=> b ? `CH${b.channel+1} ${b.type==='cc'?'CC':'NOTE'} ${b.number}` : '—';
  const groups=[['A','a'],['B','b'],['C','c'],['D','d'],['MASTER','']];
  return (
    <div className="midibackdrop" onClick={onClose}>
      <div className="midipanel" onClick={e=>e.stopPropagation()}>
        <div className="midihead">
          <h3>MIDI MAPPING</h3>
          <span className="hint">
            {devices.length ? `connected: ${devices.join(', ')}` : 'no MIDI devices detected — connect a controller'}
          </span>
          <div className="spacer"/>
          <button className="mini" onClick={onClearAll}>CLEAR ALL</button>
          <button className="btn" onClick={onClose}>CLOSE</button>
        </div>
        <div className="midilist">
          {groups.map(([label,d])=>(
            <div key={label}>
              <div className="mxlabel" style={{textAlign:'left',marginTop:10}}>{label}</div>
              {MIDI_CONTROLS.filter(c=> d ? c.id.startsWith(d+'.') : !c.id.includes('.')).map(c=>(
                <div key={c.id} className="midirow">
                  <span className="midilbl">{c.label}</span>
                  <span className="midival">{learn===c.id ? 'listening…' : fmtBinding(map[c.id])}</span>
                  <button className={'mini'+(learn===c.id?' on':'')}
                          style={learn===c.id?{background:'var(--yel)',color:'#000',borderColor:'var(--yel)'}:null}
                          onClick={()=>onLearn(learn===c.id?null:c.id)}>
                    {learn===c.id?'CANCEL':'LEARN'}
                  </button>
                  <button className="mini" disabled={!map[c.id]} onClick={()=>onClear(c.id)}>✕</button>
                </div>
              ))}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   APP
   ============================================================ */

function App(){
  const engine=useRef(null);
  if(!engine.current){
    // 'interactive' asks the platform for the smallest safe buffer — the
    // low-latency-routing half of the punch list; there's nothing else to
    // configure since ScriptProcessorNode was never used in this graph.
    const ctx=new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});
    const master=ctx.createGain();
    const limiter=ctx.createDynamicsCompressor();
    limiter.threshold.value=-2; limiter.knee.value=0;
    limiter.ratio.value=20; limiter.attack.value=0.002; limiter.release.value=0.15;
    const masterAnalyser=ctx.createAnalyser(); masterAnalyser.fftSize=512;
    const recDest=ctx.createMediaStreamDestination();
    master.connect(limiter).connect(masterAnalyser).connect(ctx.destination);
    masterAnalyser.connect(recDest);
    engine.current={
      ctx, master, masterAnalyser, recDest,
      a:new EngineDeck(ctx,master), b:new EngineDeck(ctx,master),
      c:new EngineDeck(ctx,master), d:new EngineDeck(ctx,master),
      _md:new Uint8Array(masterAnalyser.frequencyBinCount)
    };
    // Handy for poking at the graph from the console.
    window.__PULSE = engine.current;
  }
  const E=engine.current;

  // The worklet module has to finish registering before any deck's node
  // exists — everything below assumes E.a/E.b/E.c/E.d are already playable.
  const [engineReady,setEngineReady]=useState(false);
  useEffect(()=>{ Promise.all([E.a.ready, E.b.ready, E.c.ready, E.d.ready]).then(()=>setEngineReady(true)); },[]);

  const [lib,setLib]=useState([]);
  const [q,setQ]=useState('');
  const [xfade,setXfade]=useState(0.5);
  // Mirror of xfade for the auto-mixer, which needs the current fader position
  // synchronously when a blend starts (React state isn't readable mid-callback).
  const xfadeRef=useRef(0.5);
  const [volA,setVolA]=useState(0.8);
  const [volB,setVolB]=useState(0.8);
  const [xfadeCD,setXfadeCD]=useState(0.5);
  const [volC,setVolC]=useState(0.8);
  const [volD,setVolD]=useState(0.8);
  const [masterVol,setMasterVol]=useState(0.85);
  const [dropping,setDropping]=useState(false);
  const [busy,setBusy]=useState('');
  const [recording,setRecording]=useState(false);
  const recRef=useRef(null);
  const [,bump]=useState(0);
  const force=()=>bump(x=>x+1);

  // --- deck imperative handles (MIDI-driven pitch/EQ/filter/sync — see
  // DeckPanel's useImperativeHandle) ---
  const refA=useRef(null), refB=useRef(null), refC=useRef(null), refD=useRef(null);
  const deckRefs={a:refA,b:refB,c:refC,d:refD};

  // --- MIDI controller mapping ---
  const [midiMap,setMidiMapState]=useState(loadMidiMap);
  const [midiLearn,setMidiLearn]=useState(null);   // control id currently listening, or null
  const [midiOpen,setMidiOpen]=useState(false);
  const [midiDevices,setMidiDevices]=useState([]);
  const midiMapRef=useRef(midiMap); useEffect(()=>{ midiMapRef.current=midiMap; },[midiMap]);
  const midiLearnRef=useRef(midiLearn); useEffect(()=>{ midiLearnRef.current=midiLearn; },[midiLearn]);
  const setMidiMap=(m)=>{ setMidiMapState(m); saveMidiMap(m); };

  const volSetters={a:setVolA,b:setVolB,c:setVolC,d:setVolD};
  const dispatchFader=(id,v01)=>{
    if(id==='xfab'){ setXfade(v01); return; }
    if(id==='xfcd'){ setXfadeCD(v01); return; }
    if(id==='master'){ setMasterVol(v01*1.2); return; }
    const [d,ctrl]=id.split('.');
    if(!E[d]) return;
    if(ctrl==='vol'){ volSetters[d](v01); return; }
    if(ctrl==='pitch'){ deckRefs[d].current?.midiPitch((v01*2-1)*PITCH_RANGE); return; }
    if(ctrl==='low'||ctrl==='mid'||ctrl==='high'){ deckRefs[d].current?.midiEq(ctrl, v01*38-26); return; }
    if(ctrl==='filter'){ deckRefs[d].current?.midiFilter(v01*2-1); return; }
  };
  const dispatchNote=(id,pressed)=>{
    const [d,ctrl]=id.split('.');
    const deck=E[d];
    if(!deck) return;
    if(ctrl==='play'){ if(pressed){ deck.toggle(); force(); } return; }
    if(ctrl==='cue'){
      if(pressed){ if(!deck.playing) deck.setCue(); deck.toCue(); deck.play(); }
      else { deck.pause(); deck.toCue(); }
      force(); return;
    }
    if(ctrl==='sync'){ if(pressed) deckRefs[d].current?.midiSync(); return; }
    if(ctrl && ctrl.startsWith('hc')){
      if(pressed){
        const i=+ctrl.slice(2)-1;
        if(deck.hotcues[i]==null) deck.hotcues[i]=deck.position();
        else deck.jumpTo(deck.hotcues[i]);
        force();
      }
      return;
    }
  };

  // Web MIDI: connect to every available input, forward messages either into
  // the learn-capture path (armed by clicking LEARN in the panel) or through
  // the saved map to dispatchFader/dispatchNote. Runs once — freshness for
  // midiMap/midiLearn comes from the refs above, not the closure, since those
  // change far more often than this effect should re-subscribe.
  useEffect(()=>{
    if(!navigator.requestMIDIAccess) return;
    let access=null, cancelled=false;
    const onMessage=(e)=>{
      const [status,d1,d2]=e.data;
      const type=status & 0xF0, channel=status & 0x0F;
      const learn=midiLearnRef.current;
      if(learn){
        const ctrl=MIDI_CONTROLS.find(c=>c.id===learn);
        if(!ctrl) return;
        if(ctrl.kind==='fader' && type===0xB0){
          setMidiMap({...midiMapRef.current,[learn]:{type:'cc',channel,number:d1}});
          setMidiLearn(null);
        } else if(ctrl.kind==='trigger' && type===0x90 && d2>0){
          setMidiMap({...midiMapRef.current,[learn]:{type:'note',channel,number:d1}});
          setMidiLearn(null);
        }
        return;
      }
      const map=midiMapRef.current;
      for(const id in map){
        const b=map[id];
        if(b.channel!==channel || b.number!==d1) continue;
        if(b.type==='cc' && type===0xB0) dispatchFader(id, d2/127);
        else if(b.type==='note' && (type===0x90||type===0x80)) dispatchNote(id, type===0x90 && d2>0);
      }
    };
    const attach=(a)=>{
      if(cancelled) return;
      setMidiDevices([...a.inputs.values()].map(i=>i.name||i.id));
      for(const input of a.inputs.values()) input.onmidimessage=onMessage;
    };
    navigator.requestMIDIAccess().then(a=>{
      access=a; attach(a); a.onstatechange=()=>attach(a);
    }).catch(err=>console.warn('MIDI unavailable', err));
    return ()=>{ cancelled=true; if(access) for(const input of access.inputs.values()) input.onmidimessage=null; };
  },[]);

  // --- PWA install ---
  // Chromium fires beforeinstallprompt when the app is installable; we stash
  // the event and surface our own button, since the browser's default mini-
  // infobar is easy to miss. iOS Safari has no such event — there we show a
  // one-line "Add to Home Screen" hint instead (handled in the button below).
  const installEvt=useRef(null);
  const [canInstall,setCanInstall]=useState(false);
  const [installed,setInstalled]=useState(
    window.matchMedia('(display-mode: standalone)').matches ||
    window.navigator.standalone === true
  );
  useEffect(()=>{
    const onPrompt=(e)=>{ e.preventDefault(); installEvt.current=e; setCanInstall(true); };
    const onInstalled=()=>{ setInstalled(true); setCanInstall(false); installEvt.current=null; };
    window.addEventListener('beforeinstallprompt',onPrompt);
    window.addEventListener('appinstalled',onInstalled);
    return ()=>{ window.removeEventListener('beforeinstallprompt',onPrompt);
                 window.removeEventListener('appinstalled',onInstalled); };
  },[]);
  const doInstall=async()=>{
    const e=installEvt.current;
    if(e){ e.prompt(); await e.userChoice; installEvt.current=null; setCanInstall(false); }
    else {
      // iOS / browsers without the prompt event: tell the user the manual path.
      const ios=/iP(hone|ad|od)/.test(navigator.platform) || (navigator.userAgent.includes('Mac') && 'ontouchend' in document);
      alert(ios
        ? 'To install: tap the Share button, then "Add to Home Screen".'
        : 'To install: open your browser menu and choose "Install PULSE DJ" / "Add to Home screen".');
    }
  };

  // --- crossfader: constant-power curve so the middle doesn't dip ---
  useEffect(()=>{
    xfadeRef.current=xfade;
    const t=E.ctx.currentTime;
    E.a.xf.gain.setTargetAtTime(Math.cos(xfade*Math.PI/2), t, 0.01);
    E.b.xf.gain.setTargetAtTime(Math.cos((1-xfade)*Math.PI/2), t, 0.01);
  },[xfade]);
  useEffect(()=>{ E.a.vol.gain.setTargetAtTime(volA,E.ctx.currentTime,0.01); },[volA]);
  useEffect(()=>{ E.b.vol.gain.setTargetAtTime(volB,E.ctx.currentTime,0.01); },[volB]);
  useEffect(()=>{ E.master.gain.setTargetAtTime(masterVol,E.ctx.currentTime,0.01); },[masterVol]);

  // --- second crossfader: same constant-power curve, independent pair (C/D) ---
  useEffect(()=>{
    const t=E.ctx.currentTime;
    E.c.xf.gain.setTargetAtTime(Math.cos(xfadeCD*Math.PI/2), t, 0.01);
    E.d.xf.gain.setTargetAtTime(Math.cos((1-xfadeCD)*Math.PI/2), t, 0.01);
  },[xfadeCD]);
  useEffect(()=>{ E.c.vol.gain.setTargetAtTime(volC,E.ctx.currentTime,0.01); },[volC]);
  useEffect(()=>{ E.d.vol.gain.setTargetAtTime(volD,E.ctx.currentTime,0.01); },[volD]);

  // --- continuous drift correction (see syncTick above) ---
  // SYNC only pairs within a row (A<->B, C<->D) — each DeckPanel's `other`
  // prop below is fixed to its row partner, so that's the only pairing that
  // can ever have syncEngaged set.
  useEffect(()=>{
    const iv=setInterval(()=>{
      syncTick(E.a,E.b); syncTick(E.b,E.a);
      syncTick(E.c,E.d); syncTick(E.d,E.c);
    }, SYNC_TICK_MS);
    return ()=>clearInterval(iv);
  },[]);

  // The drift corrector mutates deck.bpm off-React (inside its interval), so
  // App-level readouts that depend on it — the BPM-delta line below — would
  // otherwise show stale values until the next user action. A slow re-render
  // tick keeps them live without the cost of a per-frame loop.
  useEffect(()=>{ const iv=setInterval(()=>force(), 200); return ()=>clearInterval(iv); },[]);

  // --- file ingest ---
  // Split a filename into artist/title on the usual "Artist - Title" pattern.
  const namePartsOf=(name)=>{
    const base=name.replace(/\.[^.]+$/,'');
    const m=base.match(/^(.*?)\s*[-–]\s*(.*)$/);
    return {title:(m?m[2]:base).trim(), artist:(m?m[1]:'Unknown artist').trim()};
  };

  const ingest=useCallback(async(files)=>{
    const audio=[...files].filter(f=>/\.(mp3|wav|m4a|aac|ogg|flac|aiff?|opus|webm)$/i.test(f.name)||f.type.startsWith('audio'));
    if(!audio.length) return;
    for(let i=0;i<audio.length;i++){
      const f=audio[i];
      const id=trackKey(f);
      // Already on screen — dropping the same file twice shouldn't duplicate
      // the row (and with content-derived ids it would collide anyway).
      let dup=false;
      setLib(L=>{ dup=L.some(t=>t.id===id); return L; });
      await new Promise(r=>setTimeout(r,0));
      if(dup) continue;

      try{
        const buf=await E.ctx.decodeAudioData(await f.arrayBuffer());

        // Seen before? Reuse the stored analysis instead of spending seconds
        // recomputing tempo and key for a file we've already measured.
        let rec=null;
        try{ rec=await dbGet(id); }catch{}

        let peaks, analysis, key, mode, tag, title, artist;
        if(rec && rec.peaks && rec.bpm && rec.av===ANALYSIS_VERSION){
          setBusy(`Restoring ${f.name} (${i+1}/${audio.length})…`);
          ({title,artist,key,mode,tag}=rec);
          peaks=rec.peaks;
          analysis={bpm:rec.bpm, beatOffset:rec.beatOffset};
        } else {
          setBusy(`Analysing ${f.name} (${i+1}/${audio.length})…`);
          const res=await analyseTrack(buf, 512);
          peaks=res.peaks; analysis=res.tempo;
          key=res.keyInfo.key; mode=res.keyInfo.mode;
          tag=detectTag(f.name);   // Sweep/Riser/Impact/Stinger guess; editable per row
          ({title,artist}=namePartsOf(f.name));
        }

        const track={
          id, file:f, buffer:buf, peaks, analysis,
          title, artist, bpm:analysis.bpm, duration:buf.duration,
          tag:tag||null, key, mode
        };
        setLib(L=> L.some(t=>t.id===id) ? L : [...L,track]);
        // Best-effort: a full disk or a browser with storage disabled costs
        // persistence, not the import — the track still plays this session.
        try{ await dbPut(toRecord(track)); }
        catch(err){ console.warn('could not persist track', f.name, err); }
      }catch(err){
        console.warn('import failed', f.name, err);
        setBusy(`Could not import ${f.name}`);
        await new Promise(r=>setTimeout(r,1200));
      }
    }
    setBusy('');
  },[]);

  // --- restore the library on startup -------------------------------------
  // Only decoding happens here; tempo/key/peaks come back from storage, so a
  // saved library reopens in about the time it takes to decode the audio
  // rather than re-running full analysis on every track.
  useEffect(()=>{
    let cancelled=false;
    (async()=>{
      let recs=[];
      try{ recs=await dbGetAll(); }
      catch(err){ console.warn('library restore unavailable', err); return; }
      if(!recs.length || cancelled) return;
      const stale=recs.filter(r=>r.av!==ANALYSIS_VERSION).length;
      setBusy(stale ? `Re-analysing library (${stale} of ${recs.length})…`
                    : `Restoring library (${recs.length})…`);
      const restored=[];
      let done=0;
      for(const r of recs){
        if(cancelled) return;
        try{
          const buf=await E.ctx.decodeAudioData(await r.file.arrayBuffer());
          let peaks=r.peaks, bpm=r.bpm, beatOffset=r.beatOffset, key=r.key, mode=r.mode;
          if(r.av!==ANALYSIS_VERSION){
            // Measured by an older analyser — redo it and write the result back,
            // so the improvement reaches tracks imported before the change
            // rather than only ones added afterwards.
            done++;
            setBusy(`Re-analysing library (${done} of ${stale})…`);
            const res=await analyseTrack(buf,512);
            peaks=res.peaks; bpm=res.tempo.bpm; beatOffset=res.tempo.beatOffset;
            key=res.keyInfo.key; mode=res.keyInfo.mode;
            try{
              await dbPut({...r, av:ANALYSIS_VERSION, peaks, bpm, beatOffset, key, mode});
            }catch(err){ console.warn('could not persist re-analysis', r.id, err); }
          }
          restored.push({
            id:r.id, file:r.file, buffer:buf, peaks,
            analysis:{bpm, beatOffset},
            title:r.title, artist:r.artist, bpm, duration:r.duration,
            tag:r.tag||null, key, mode
          });
        }catch(err){
          // Unreadable record (corrupt blob, codec no longer supported) —
          // drop it rather than wedging the whole restore on one bad row.
          console.warn('dropping unreadable library entry', r.id, err);
          try{ await dbDelete(r.id); }catch{}
        }
      }
      if(cancelled) return;
      // Merge rather than replace: an eager drag-and-drop during the restore
      // shouldn't get clobbered when this finishes.
      setLib(L=>{
        const have=new Set(L.map(t=>t.id));
        return [...L, ...restored.filter(t=>!have.has(t.id))];
      });
      setBusy('');
    })();
    return ()=>{ cancelled=true; };
  },[]);

  const loadTo=async(track,which)=>{
    E.ctx.resume();
    const d=E[which];
    await d.load(track.buffer, track.peaks, track.analysis, track);
    force();
  };

  // Double-click target for library rows: the first idle deck in A,B,C,D
  // order, or A if all four are already playing (matches the old A/B-only
  // behaviour when there are only two decks loaded).
  const firstIdleDeck=()=>{
    for(const w of ['a','b','c','d']) if(!E[w].playing) return w;
    return 'a';
  };

  // Drop a track from the library list, releasing its decoded AudioBuffer for
  // GC. A deck that already loaded it keeps its own reference and plays on —
  // this only removes the library entry, it doesn't unload a live deck. Also
  // purges the id from every crate so crates don't accumulate dangling refs.
  const removeTrack=(id)=>{
    setLib(L=>L.filter(t=>t.id!==id));
    setCrates(cs=>cs.map(c=>({...c,trackIds:c.trackIds.filter(tid=>tid!==id)})));
    dbDelete(id).catch(err=>console.warn('could not un-persist track', id, err));
  };

  // Wipe the stored library. Worth having its own control now that tracks
  // persist: without it the only way to reclaim the space is per-row, and a
  // library big enough to be worth clearing is exactly the one that's slow
  // to clear one row at a time.
  // A tap-tempo or grid-nudge correction on a deck, written back to the
  // library row and to storage. Without the write-back the fix would last
  // only until the track was reloaded, which is no fix at all — and every
  // downstream consumer (auto-play's tempo gate, phrase alignment, the BPM
  // column) reads the library copy, not the deck's.
  const updateGrid=(id,bpm,beatOffset)=>{
    setLib(L=>L.map(t=>{
      if(t.id!==id) return t;
      const next={...t, bpm, analysis:{...t.analysis, bpm, beatOffset}};
      delete next._phraseAnchor;   // derived from the grid that just changed
      return next;
    }));
    dbGet(id).then(rec=>{ if(rec) return dbPut({...rec, bpm, beatOffset}); })
             .catch(err=>console.warn('could not persist grid change', id, err));
  };

  const clearLibrary=async()=>{
    if(!confirm(`Remove all ${lib.length} tracks from the library? Crates are kept, and anything already on a deck keeps playing.`)) return;
    const ids=lib.map(t=>t.id);
    setLib([]);
    for(const id of ids){ try{ await dbDelete(id); }catch{} }
  };

  // Set/clear a library row's FX tag (Sweep/Riser/Impact/Stinger).
  const setTag=(id,tag)=>{
    setLib(L=>L.map(t=>t.id===id?{...t,tag:tag||null}:t));
    dbGet(id).then(rec=>{ if(rec) return dbPut({...rec, tag:tag||null}); })
             .catch(err=>console.warn('could not persist tag', id, err));
  };
  // Only tagged files populate the decks' FX slots.
  const fxItems=useMemo(()=>lib.filter(t=>t.tag),[lib]);
  const [tagFilter,setTagFilter]=useState('');   // '' = show all; else a single FX tag

  // --- library filters: BPM range + detected key ---
  const [bpmMin,setBpmMin]=useState('');
  const [bpmMax,setBpmMax]=useState('');
  const [keyFilter,setKeyFilter]=useState('');
  const libKeys=useMemo(()=>{
    const s=new Set();
    for(const t of lib) if(t.key) s.add(`${t.key} ${t.mode?.[0].toUpperCase()||''}`);
    return [...s].sort();
  },[lib]);
  const filtersActive = bpmMin!=='' || bpmMax!=='' || keyFilter!=='';
  const clearFilters=()=>{ setBpmMin(''); setBpmMax(''); setKeyFilter(''); };

  // --- crates: named, persisted subsets of the library (by track id) ---
  const [crates,setCratesState]=useState(loadCrates);
  const [activeCrate,setActiveCrate]=useState(null);   // crate id, or null = all tracks
  const setCrates=(updater)=>{
    setCratesState(prev=>{
      const next = typeof updater==='function' ? updater(prev) : updater;
      saveCrates(next);
      return next;
    });
  };
  const newCrate=()=>{
    const name=(prompt('Crate name:')||'').trim();
    if(!name) return;
    const c={id:Math.random().toString(36).slice(2), name, trackIds:[]};
    setCrates(cs=>[...cs,c]);
    setActiveCrate(c.id);
  };
  const renameCrate=(id)=>{
    const c=crates.find(x=>x.id===id); if(!c) return;
    const name=(prompt('Rename crate:', c.name)||'').trim();
    if(!name) return;
    setCrates(cs=>cs.map(x=>x.id===id?{...x,name}:x));
  };
  const deleteCrate=(id)=>{
    const c=crates.find(x=>x.id===id); if(!c) return;
    if(!confirm(`Delete crate "${c.name}"? Tracks stay in the library.`)) return;
    setCrates(cs=>cs.filter(x=>x.id!==id));
    if(activeCrate===id) setActiveCrate(null);
  };
  const addToCrate=(crateId,trackId)=>{
    if(!crateId) return;
    setCrates(cs=>cs.map(c=>c.id===crateId && !c.trackIds.includes(trackId)
      ? {...c,trackIds:[...c.trackIds,trackId]} : c));
  };
  const removeFromCrate=(crateId,trackId)=>{
    setCrates(cs=>cs.map(c=>c.id===crateId ? {...c,trackIds:c.trackIds.filter(id=>id!==trackId)} : c));
  };

  /* --- AUTO-DJ -------------------------------------------------------
     Runs the A/B pair hands-free: picks the next track by tempo + key
     compatibility (see trackScore above), loads it onto the free deck,
     beat-syncs it, and crossfades over the last few seconds of the
     outgoing track. C/D are deliberately left alone so you can still
     drop a manual track over the top of an auto-mixed set.
     Everything it does goes through the same primitives the UI does
     (loadTo / doSync / setXfade), so taking over mid-set is just a
     matter of switching it off — nothing to unwind. */
  const [autoDj,setAutoDj]=useState(false);
  const [autoNext,setAutoNext]=useState(null);   // track queued for the next blend (display only)
  const autoBusy=useRef(false);                  // a transition is in flight — don't start another
  const autoFadeCancel=useRef(null);             // aborts the blend in progress, if any
  const autoPlayed=useRef(new Set());            // ids played this session, so the set doesn't loop

  // Pool: the active crate if one is selected, otherwise the whole library.
  // Deliberately NOT the search-filtered `shown` — typing in the search box
  // shouldn't silently change what the auto-mixer is allowed to play next.
  const autoPool=useMemo(()=>{
    const crate=activeCrate ? crates.find(c=>c.id===activeCrate) : null;
    return crate ? lib.filter(t=>crate.trackIds.includes(t.id)) : lib;
  },[lib,crates,activeCrate]);
  const autoPoolRef=useRef(autoPool); useEffect(()=>{ autoPoolRef.current=autoPool; },[autoPool]);

  // Animate the crossfader from wherever it is to `target` over `fadeSec`,
  // moving the same React state a hand would, so the on-screen fader and the
  // audio stay in step.
  //
  // Deliberately setInterval + wall-clock, NOT requestAnimationFrame: rAF is
  // suspended outright in a hidden tab, so a user switching away mid-blend
  // would freeze the transition forever with both decks audible and autoBusy
  // stuck true. setInterval is merely throttled (~1s) in the background, and
  // because progress is derived from elapsed time rather than accumulated per
  // tick, a throttled tick still lands on the right value and the blend still
  // finishes on schedule.
  // Also performs the bass swap that makes the blend sound deliberate rather
  // than muddy: two full-range basslines on top of each other is the single
  // thing that most makes an automatic mix sound automatic. The incoming
  // track comes in with its lows killed, and they trade places around the
  // midpoint — the standard move, done by hand on every club mixer.
  //
  // The EQ is driven through the deck's own setter (the same one the MIDI
  // path uses), so the on-screen LOW knobs visibly turn as it happens rather
  // than the audio and the UI disagreeing.
  const AUTO_BASS_KILL=-26;   // matches the LOW knob's floor
  const autoCrossfade=({target, fadeSec, fromDeck, toDeck, onDone})=>{
    const start=Date.now();
    const from=xfadeRef.current;
    const outRef=deckRefs[fromDeck], inRef=deckRefs[toDeck];
    // Whatever the user had dialled in stays the destination — auto mode
    // shouldn't quietly reset a deck's EQ to flat.
    const outLow=(outRef.current&&outRef.current.getEq().low)||0;
    const inLow=(inRef.current&&inRef.current.getEq().low)||0;
    inRef.current&&inRef.current.midiEq('low',AUTO_BASS_KILL);
    let lastSwap=-1;
    const iv=setInterval(()=>{
      const k=Math.min(1,(Date.now()-start)/(fadeSec*1000));
      setXfade(from+(target-from)*k);
      // Swap centred on the midpoint, over the middle 30% of the blend.
      const s=Math.max(0,Math.min(1,(k-0.35)/0.3));
      if(s!==lastSwap){
        lastSwap=s;
        inRef.current&&inRef.current.midiEq('low', AUTO_BASS_KILL+(inLow-AUTO_BASS_KILL)*s);
        outRef.current&&outRef.current.midiEq('low', outLow+(AUTO_BASS_KILL-outLow)*s);
      }
      if(k>=1){
        clearInterval(iv);
        // Hand the outgoing deck back with its own EQ intact — it's silent by
        // now, so this is inaudible, and it stops a deck accumulating a killed
        // bass that would silently ruin the next track loaded onto it.
        outRef.current&&outRef.current.midiEq('low', outLow);
        inRef.current&&inRef.current.midiEq('low', inLow);
        onDone && onDone();
      }
    },50);
    // Abandon the blend where it stands (auto mode switched off mid-transition).
    // The crossfader is left exactly where it is — that's a real mixer position,
    // and snapping it either way would be a jump the user didn't ask for — but
    // the bass kill is undone, because that was the automation's doing and not
    // a setting anyone chose. onDone is deliberately NOT called: the outgoing
    // deck keeps playing, so whoever just took over still has both hands on it.
    return ()=>{
      clearInterval(iv);
      outRef.current&&outRef.current.midiEq('low', outLow);
      inRef.current&&inRef.current.midiEq('low', inLow);
    };
  };

  // How long the blend should run, in BEATS rather than seconds, chosen from
  // how well the two tracks actually go together:
  //
  //   32 beats  keys sit together and the energy carries over — there's
  //             nothing to hide, so let the two records breathe.
  //   16 beats  the normal case.
  //    8 beats  a key clash or an energy step. Both sound worse the longer
  //             you hold them, so get through it.
  //
  // Whole phrases only, so the blend starts and ends at the same point in
  // both tracks' 16-beat cycles. Falls back to shorter lengths when the
  // outgoing track hasn't the room, and the whole thing is scaled by the
  // deck's rate so the beat count is honoured at the pitch actually playing.
  const autoPlan=(deck,cand)=>{
    const cur=deck.track;
    const bl=(deck.bpm ? 60/deck.bpm : 0.5);
    const phraseSec=PHRASE_BEATS*bl;
    const compat=cur&&cand ? 0.55*keyScore(cur,cand)+0.45*energyScore(cur,cand) : 0.5;
    let beats = compat>=0.78 ? 32 : compat>=0.5 ? 16 : 8;

    // The blend plus a phrase of slack to wait for a boundary has to fit in
    // the track, and shouldn't swallow more than a third of it.
    const budget=Math.min(deck.duration*0.33, Math.max(0, deck.duration-2));
    while(beats>8 && beats*bl+phraseSec>budget) beats/=2;

    const fade=Math.min(beats*bl, Math.max(1, budget));
    // Start hunting for a phrase boundary a phrase before the blend is due,
    // so there's always one to catch.
    const lead=fade+phraseSec;
    return {beats, fade, lead, phraseSec, compat};
  };

  useEffect(()=>{
    if(!autoDj) return;
    const tick=async()=>{
      if(autoBusy.current) return;
      const pool=autoPoolRef.current;
      if(!pool.length) return;

      // Retire any deck sitting past the end of its buffer, whatever else is
      // going on. The worklet keeps reporting `playing` off the end of a
      // track, and a stopped-but-still-"live" deck poisons the counts below:
      // two of them and the mid-set branch bows out as if the user were
      // mixing by hand, so auto mode would wait forever on a deck that is
      // never going to finish. Reachable in normal use by switching auto off
      // mid-blend (which leaves both decks running, by design) and back on.
      for(const w of ['a','b']){
        const d=E[w];
        if(d.playing && d.track && d.duration-d.position()<=0){ d.pause(); force(); }
      }

      const live=['a','b'].filter(w=>E[w].playing && E[w].track);

      // Cold start: nothing rolling on A/B — load the first track and go.
      if(live.length===0){
        const pick=pickNextTrack(null,pool,autoPlayed.current);
        if(!pick) return;
        autoBusy.current=true;
        try{
          await loadTo(pick.track,'a');
          autoPlayed.current.add(pick.track.id);
          setXfade(0);            // hard left: deck A alone
          E.a.seek(firstBeatOffset(pick.track));   // skip any silent lead-in
          E.a.play();
          force();
        } finally { autoBusy.current=false; }
        return;
      }

      // Mid-set: only act on a single rolling deck. If both are playing we're
      // either mid-blend or the user has taken manual control — either way,
      // stay out of it.
      if(live.length!==1) return;
      const from=live[0], to=from==='a'?'b':'a';
      const deck=E[from];
      const remain=deck.duration-deck.position();

      // Widest plan this track could need, purely to decide whether it's yet
      // worth looking for a partner. The real plan depends on which track wins.
      if(remain>autoPlan(deck,null).lead) return;

      let exclude=new Set(autoPlayed.current);
      if(E[to].track) exclude.add(E[to].track.id);
      let pick=pickNextTrack(deck.track,pool,exclude);
      // Every track already played: wrap around rather than dead-ending the
      // set, keeping only what's currently on the decks excluded so the next
      // pick can't be an immediate repeat of what's audible.
      if(!pick && autoPlayed.current.size){
        autoPlayed.current=new Set([deck.track&&deck.track.id, E[to].track&&E[to].track.id].filter(Boolean));
        exclude=new Set(autoPlayed.current);
        pick=pickNextTrack(deck.track,pool,exclude);
      }
      if(!pick) return;   // genuinely nothing mixable — let the current track ride out

      // Now the pair is known, size the blend to how well they actually fit.
      const {beats,fade,lead}=autoPlan(deck,pick.track);
      if(remain>lead) return;

      autoBusy.current=true;
      try{
        // Hold until the outgoing track crosses a phrase boundary, so the
        // blend begins where a bar does. Everything downstream is already
        // beat-locked; this is what additionally lines up the 16-beat cycles,
        // and it's the difference between a mix that lands and one that's
        // technically in time but a bar out of step.
        const pos=deck.position();
        const waitSrc=nextPhrase(deck.track,pos)-pos;
        const waitSec=waitSrc/Math.max(0.05,deck.rate);
        // Only wait if the blend still finishes with room to spare afterwards.
        if(waitSec>0.05 && waitSec<remain-fade){
          await new Promise(r=>setTimeout(r, waitSec*1000));
          if(!autoDj || !deck.playing){ autoBusy.current=false; return; }
        }
        await loadTo(pick.track,to);
        autoPlayed.current.add(pick.track.id);
        pick.track._beats=beats;          // shown in the topbar readout
        setAutoNext(pick.track);
        // Drop in at the first beat, not 0:00, so a quiet intro doesn't get
        // spent on the blend. Seek before play/sync: lockToLeader preserves
        // the follower's own position (quantised to its grid), so the start
        // point survives the beat-lock.
        E[to].seek(firstBeatOffset(pick.track));
        E[to].play();
        // Beat-lock the incoming deck to the one already rolling. Same call
        // the SYNC button makes, so it inherits the octave-fold handling and
        // the ±16% range check.
        deckRefs[to].current?.midiSync();
        force();
        autoFadeCancel.current=autoCrossfade({
          target: to==='a'?0:1, fadeSec: fade, fromDeck: from, toDeck: to,
          onDone: ()=>{
            deck.pause();          // outgoing deck is silent by now — stop it
            autoFadeCancel.current=null;
            setAutoNext(null);
            autoBusy.current=false;
            force();
          }
        });
      }catch(err){
        console.warn('auto-dj transition failed', err);
        autoBusy.current=false;
      }
    };
    const iv=setInterval(tick,500);
    return ()=>clearInterval(iv);
  },[autoDj]);

  // Leaving auto mode hands control back at once: any blend in progress is
  // abandoned where it stands rather than being allowed to play itself out,
  // so the controls are yours the moment you hit the button. The played-set is
  // kept, so switching auto back on continues the set instead of replaying it.
  useEffect(()=>{
    if(autoDj) return;
    if(autoFadeCancel.current){ autoFadeCancel.current(); autoFadeCancel.current=null; }
    autoBusy.current=false;
    setAutoNext(null);
    force();
  },[autoDj]);

  // --- drag & drop ---
  useEffect(()=>{
    const over=e=>{e.preventDefault();setDropping(true);};
    const leave=e=>{ if(e.clientX===0&&e.clientY===0) setDropping(false); };
    const drop=e=>{e.preventDefault();setDropping(false);ingest(e.dataTransfer.files);};
    window.addEventListener('dragover',over);
    window.addEventListener('dragleave',leave);
    window.addEventListener('drop',drop);
    return ()=>{
      window.removeEventListener('dragover',over);
      window.removeEventListener('dragleave',leave);
      window.removeEventListener('drop',drop);
    };
  },[ingest]);

  // --- keyboard ---
  useEffect(()=>{
    const onKey=(e)=>{
      if(e.target.tagName==='INPUT') return;
      if(!E.a.link.node||!E.b.link.node||!E.c.link.node||!E.d.link.node) return;  // worklets not registered yet
      const k=e.key.toLowerCase();
      E.ctx.resume();
      const map={
        q:()=>E.a.toggle(), p:()=>E.b.toggle(),
        w:()=>{E.a.toCue();}, o:()=>{E.b.toCue();},
        e:()=>{E.a.setCue();}, i:()=>{E.b.setCue();},
        // C/D mirror the A/B layout one row down on the keyboard: A S D sit
        // under Q W E, and L K J sit under P O I (right-to-left, mirroring
        // B's P/O/I order) — no hotcues on these two, mouse/touch only.
        a:()=>E.c.toggle(), l:()=>E.d.toggle(),
        s:()=>{E.c.toCue();}, k:()=>{E.d.toCue();},
        d:()=>{E.c.setCue();}, j:()=>{E.d.setCue();},
      };
      if(map[k]){ e.preventDefault(); map[k](); force(); return; }
      // Detect the digit via e.code, not e.key, so Shift+number still
      // identifies the pad (Shift+1 reports e.key "!"). Shift/Alt clears the
      // cue; otherwise set-or-jump exactly like the on-screen pads — quantized
      // and slip-aware via jumpTo, rather than the old raw seek.
      const digit = /^Digit[0-9]$/.test(e.code) ? e.code.slice(5) : null;
      const kbHotcue=(deck,i)=>{
        if(e.shiftKey||e.altKey) deck.hotcues[i]=null;
        else if(deck.hotcues[i]==null) deck.hotcues[i]=deck.position();
        else deck.jumpTo(deck.hotcues[i]);
        force();
      };
      if(digit && '1234'.includes(digit)){ e.preventDefault(); kbHotcue(E.a, +digit-1); return; }
      if(digit && '7890'.includes(digit)){ e.preventDefault(); kbHotcue(E.b, digit==='0'?3:+digit-7); return; }
      if(e.key==='ArrowLeft'){ setXfade(v=>Math.max(0,v-0.05)); }
      if(e.key==='ArrowRight'){ setXfade(v=>Math.min(1,v+0.05)); }
      if(e.code==='Space'){ e.preventDefault(); setXfade(v=>v<0.5?1:0); }
    };
    window.addEventListener('keydown',onKey);
    return ()=>window.removeEventListener('keydown',onKey);
  },[]);

  // --- master meter ---
  const masterRef=useRef(null);
  useEffect(()=>{
    let raf;
    const tick=()=>{
      const el=masterRef.current;
      if(el){
        E.masterAnalyser.getByteFrequencyData(E._md);
        let m=0; for(let i=0;i<E._md.length;i++) if(E._md[i]>m) m=E._md[i];
        const lit=Math.round(m/255*12);
        for(let i=0;i<12;i++){
          const c=el.children[i]; if(!c) continue;
          c.style.background = i<lit ? (i>9?'var(--red)':i>7?'var(--yel)':'var(--grn)') : '#1a1f28';
        }
      }
      raf=requestAnimationFrame(tick);
    };
    tick(); return ()=>cancelAnimationFrame(raf);
  },[]);

  // --- recording the master mix ---
  // Safari's MediaRecorder doesn't support WebM (only MP4/AAC), so a
  // hardcoded 'audio/webm' throws NotSupportedError there — and Safari/iOS is
  // exactly the platform the PWA bits above target. Pick the first supported
  // container instead, and let an empty options fall back to the UA default.
  const pickRecMime=()=>{
    const cands=['audio/webm;codecs=opus','audio/webm','audio/mp4;codecs=mp4a.40.2','audio/mp4'];
    if(typeof MediaRecorder==='undefined' || !MediaRecorder.isTypeSupported) return '';
    return cands.find(t=>MediaRecorder.isTypeSupported(t)) || '';
  };
  const toggleRec=()=>{
    if(recording){ recRef.current && recRef.current.stop(); return; }
    if(typeof MediaRecorder==='undefined'){
      alert('Recording isn’t supported in this browser.');
      return;
    }
    let mr;
    try{
      const mime=pickRecMime();
      mr=new MediaRecorder(E.recDest.stream, mime?{mimeType:mime}:undefined);
    }catch(err){
      console.warn('MediaRecorder init failed', err);
      alert('Recording couldn’t start in this browser.');
      return;
    }
    const chunks=[];
    mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);
    mr.onstop=()=>{
      // Derive the file extension from what the recorder actually produced,
      // not a fixed .webm — an .mp4 blob renamed .webm won't play.
      const type=mr.mimeType||chunks[0]?.type||'audio/webm';
      const ext=/mp4|aac|mpeg/i.test(type)?'m4a':/ogg/i.test(type)?'ogg':'webm';
      const blob=new Blob(chunks,{type});
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download=`pulse-set-${new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}.${ext}`;
      a.click();
      setRecording(false);
    };
    mr.start(); recRef.current=mr; setRecording(true);
  };

  const shown=useMemo(()=>{
    const s=q.trim().toLowerCase();
    const crate=activeCrate ? crates.find(c=>c.id===activeCrate) : null;
    const lo=bpmMin===''?null:parseFloat(bpmMin), hi=bpmMax===''?null:parseFloat(bpmMax);
    return lib.filter(t=>{
      if(crate && !crate.trackIds.includes(t.id)) return false;
      if(tagFilter && t.tag!==tagFilter) return false;
      if(lo!=null && t.bpm<lo) return false;
      if(hi!=null && t.bpm>hi) return false;
      if(keyFilter && `${t.key} ${t.mode?.[0].toUpperCase()||''}`!==keyFilter) return false;
      if(s && !(t.title+' '+t.artist).toLowerCase().includes(s)) return false;
      return true;
    });
  },[lib,q,tagFilter,activeCrate,crates,bpmMin,bpmMax,keyFilter]);

  const fileInput=useRef(null);

  if(!engineReady){
    return (
      <div className="app" style={{display:'grid',placeItems:'center'}}>
        <div className="hint">Initializing audio engine…</div>
      </div>
    );
  }

  return (
    <div className="app" onPointerDown={()=>E.ctx.resume()}>
      {dropping && <div className="drop">DROP TO LOAD</div>}

      <div className="topbar">
        <div className="logo">PULSE&nbsp;DJ</div>
        <button className="btn" onClick={()=>fileInput.current.click()}>+ ADD TRACKS</button>
        <input ref={fileInput} type="file" accept="audio/*" multiple hidden
               onChange={e=>{ingest(e.target.files); e.target.value='';}}/>
        <span className="hint">{busy || 'drag audio files anywhere · Q/P play A/B · W/O cue · A·S·D play/cue C · L·K·J play/cue D · 1-4 & 7-0 hotcues · ←/→ crossfade A/B · space slam'}</span>
        <div className="spacer"/>
        <div className="master-meter" ref={masterRef}>
          {Array.from({length:12},(_,i)=>
            <div key={i} style={{width:4,height:4+i*1,background:'#1a1f28',borderRadius:1}}/>)}
        </div>
        <button className={'btn auto'+(autoDj?' on':'')}
                onClick={()=>{E.ctx.resume();setAutoDj(v=>!v);}}
                title="Auto-DJ: mixes decks A/B hands-free, choosing each next track by tempo and key compatibility. C/D stay manual. Switching it off hands control back immediately, mid-blend if need be.">
          {autoDj?'■ AUTO ON':'✨ AUTO DJ'}
        </button>
        {autoDj && <span className="hint" style={{maxWidth:150,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
          {autoNext?`→ ${autoNext.title}${autoNext._beats?` · ${autoNext._beats} beats`:''}`
                   :`${autoPool.length} in pool`}
        </span>}
        <button className={'btn rec'+(recording?' on':'')} onClick={toggleRec}>
          {recording?'■ STOP REC':'● REC MIX'}
        </button>
        <button className={'btn'+(midiDevices.length?' on':'')} onClick={()=>setMidiOpen(true)}
                title={midiDevices.length?`connected: ${midiDevices.join(', ')}`:'map a MIDI controller'}>
          🎛 MIDI{midiDevices.length?` (${midiDevices.length})`:''}
        </button>
        {midiOpen &&
          <MidiPanel devices={midiDevices} map={midiMap} learn={midiLearn}
                     onLearn={setMidiLearn}
                     onClear={(id)=>{ const m={...midiMap}; delete m[id]; setMidiMap(m); }}
                     onClearAll={()=>setMidiMap({})}
                     onClose={()=>{ setMidiOpen(false); setMidiLearn(null); }}/>}
        {!installed &&
          <button className="install" onClick={doInstall} title="Install PULSE DJ as an app">
            {canInstall?'⬇ INSTALL':'📱 INSTALL'}
          </button>}
      </div>

      <div className="deckrows">
        <div className="decks">
          <DeckPanel ref={refA} deck={E.a} id="A" accent="var(--a)" other={E.b} bump={force} fxItems={fxItems} onGridChange={updateGrid}/>

          <div className="mixer">
            <div className="mxlabel" style={{borderTop:'none',marginTop:0}}>MASTER</div>
            <div style={{display:'flex',justifyContent:'center'}}>
              <Knob label="GAIN" value={masterVol} min={0} max={1.2} color="#e6ebf2" size={46}
                    onChange={setMasterVol} fmt={v=>Math.round(v*100)+'%'}/>
            </div>

            <div className="mxlabel">CHANNEL FADERS</div>
            <div className="chan">
              <div className="vslot">
                <div className="vpair">
                  <Meter getLevel={()=>E.a.level()}/>
                  <input className="vol" type="range" min="0" max="1" step="0.01"
                         value={volA} onChange={e=>setVolA(parseFloat(e.target.value))}/>
                </div>
                <div className="knoblbl" style={{color:'var(--a)'}}>A</div>
              </div>
              <div className="vslot">
                <div className="vpair">
                  <input className="vol" type="range" min="0" max="1" step="0.01"
                         value={volB} onChange={e=>setVolB(parseFloat(e.target.value))}/>
                  <Meter getLevel={()=>E.b.level()}/>
                </div>
                <div className="knoblbl" style={{color:'var(--b)'}}>B</div>
              </div>
            </div>

            <div className="mxlabel">CROSSFADER</div>
            <input className="xf" type="range" min="0" max="1" step="0.01"
                   value={xfade} onChange={e=>setXfade(parseFloat(e.target.value))}/>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:9,color:'var(--dim)',fontWeight:700}}>
              <span style={{color:'var(--a)'}}>A</span>
              <button className="mini" onClick={()=>setXfade(0.5)}>CENTER</button>
              <span style={{color:'var(--b)'}}>B</span>
            </div>

            <div className="mxlabel">BEAT MATCH</div>
            <div style={{textAlign:'center',fontSize:11,color:'var(--dim)',fontVariantNumeric:'tabular-nums'}}>
              {E.a.bpm&&E.b.bpm
                ? <span>Δ {Math.abs(E.a.bpm-E.b.bpm).toFixed(1)} BPM</span>
                : <span>load both decks</span>}
            </div>
          </div>

          <DeckPanel ref={refB} deck={E.b} id="B" accent="var(--b)" other={E.a} bump={force} fxItems={fxItems} onGridChange={updateGrid}/>
        </div>

        <div className="decks">
          <DeckPanel ref={refC} deck={E.c} id="C" accent="var(--c)" other={E.d} bump={force} fxItems={fxItems} onGridChange={updateGrid}/>

          <div className="mixer">
            <div className="mxlabel" style={{borderTop:'none',marginTop:0}}>CHANNEL FADERS</div>
            <div className="chan">
              <div className="vslot">
                <div className="vpair">
                  <Meter getLevel={()=>E.c.level()}/>
                  <input className="vol" type="range" min="0" max="1" step="0.01"
                         value={volC} onChange={e=>setVolC(parseFloat(e.target.value))}/>
                </div>
                <div className="knoblbl" style={{color:'var(--c)'}}>C</div>
              </div>
              <div className="vslot">
                <div className="vpair">
                  <input className="vol" type="range" min="0" max="1" step="0.01"
                         value={volD} onChange={e=>setVolD(parseFloat(e.target.value))}/>
                  <Meter getLevel={()=>E.d.level()}/>
                </div>
                <div className="knoblbl" style={{color:'var(--d)'}}>D</div>
              </div>
            </div>

            <div className="mxlabel">CROSSFADER</div>
            <input className="xf" type="range" min="0" max="1" step="0.01"
                   value={xfadeCD} onChange={e=>setXfadeCD(parseFloat(e.target.value))}/>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:9,color:'var(--dim)',fontWeight:700}}>
              <span style={{color:'var(--c)'}}>C</span>
              <button className="mini" onClick={()=>setXfadeCD(0.5)}>CENTER</button>
              <span style={{color:'var(--d)'}}>D</span>
            </div>

            <div className="mxlabel">BEAT MATCH</div>
            <div style={{textAlign:'center',fontSize:11,color:'var(--dim)',fontVariantNumeric:'tabular-nums'}}>
              {E.c.bpm&&E.d.bpm
                ? <span>Δ {Math.abs(E.c.bpm-E.d.bpm).toFixed(1)} BPM</span>
                : <span>load both decks</span>}
            </div>
          </div>

          <DeckPanel ref={refD} deck={E.d} id="D" accent="var(--d)" other={E.c} bump={force} fxItems={fxItems} onGridChange={updateGrid}/>
        </div>
      </div>

      <div className="lib">
        <div className="libhead">
          <h3>LIBRARY · {lib.length}</h3>
          <input className="search" placeholder="Search title or artist…"
                 value={q} onChange={e=>setQ(e.target.value)}/>
          <div className="tagchips">
            <button className={'chip'+(tagFilter===''?' on':'')} onClick={()=>setTagFilter('')}>ALL</button>
            {FX_TAGS.map(tg=>(
              <button key={tg} className={'chip'+(tagFilter===tg?' on':'')}
                      style={tagFilter===tg?{background:TAG_COLORS[tg],color:'#000',borderColor:TAG_COLORS[tg]}:null}
                      onClick={()=>setTagFilter(tg)}>{tg}</button>
            ))}
          </div>
          <div className="spacer" style={{flex:1}}/>
          {lib.length>0 &&
            <button className="mini" onClick={clearLibrary}
                    title="remove every track from the library and from stored data">CLEAR LIBRARY</button>}
          <span className="hint">double-click a row to load the free deck</span>
        </div>
        <div className="cratebar">
          <button className={'chip'+(activeCrate===null?' on':'')} onClick={()=>setActiveCrate(null)}>ALL TRACKS</button>
          {crates.map(c=>(
            <button key={c.id} className={'chip'+(activeCrate===c.id?' on':'')}
                    onClick={()=>setActiveCrate(c.id)}
                    onDoubleClick={()=>renameCrate(c.id)}
                    title="double-click to rename">
              {c.name} · {c.trackIds.length}
            </button>
          ))}
          <button className="mini" onClick={newCrate}>+ NEW CRATE</button>
          {activeCrate && <button className="mini" onClick={()=>deleteCrate(activeCrate)}>DELETE CRATE</button>}
        </div>
        <div className="filterbar">
          <span className="hint" style={{flex:'none'}}>BPM</span>
          <input className="numin" type="number" placeholder="min" value={bpmMin}
                 onChange={e=>setBpmMin(e.target.value)}/>
          <span className="hint" style={{flex:'none'}}>–</span>
          <input className="numin" type="number" placeholder="max" value={bpmMax}
                 onChange={e=>setBpmMax(e.target.value)}/>
          <span className="hint" style={{flex:'none',marginLeft:6}}>KEY</span>
          <select className="tagsel" style={{width:64,flex:'none'}}
                  value={keyFilter} onChange={e=>setKeyFilter(e.target.value)}>
            <option value="">all</option>
            {libKeys.map(k=><option key={k} value={k}>{k}</option>)}
          </select>
          {filtersActive && <button className="mini" onClick={clearFilters}>CLEAR FILTERS</button>}
        </div>
        <div className="liblist">
          {shown.length===0 && <div className="empty">
            Drag audio files anywhere in the window, or hit <b>+ ADD TRACKS</b>.<br/>
            Each track is analysed for tempo, beat grid and frequency content on import.
          </div>}
          {shown.map(t=>(
            <div key={t.id} className="lrow"
                 onDoubleClick={()=>loadTo(t, firstIdleDeck())}>
              <div className="nm"><b>{t.title}</b> <span style={{color:'var(--dim)'}}>— {t.artist}</span></div>
              <select className="tagsel" value={t.tag||''}
                      onClick={e=>e.stopPropagation()}
                      onChange={e=>setTag(t.id, e.target.value)}
                      style={t.tag?{color:'#000',background:TAG_COLORS[t.tag],borderColor:TAG_COLORS[t.tag]}:null}>
                <option value="">— tag —</option>
                {FX_TAGS.map(tg=><option key={tg} value={tg}>{tg}</option>)}
              </select>
              <div className="mu" style={{textAlign:'center',fontSize:'10px',fontWeight:700}}>
                {t.key?`${t.key} ${t.mode?.[0].toUpperCase()}`:'-'}
              </div>
              <div className="mu">{t.bpm.toFixed(1)} BPM</div>
              <div className="mu">{fmtTime(t.duration).split('.')[0]}</div>
              <div className="mu">{Math.round(t.file.size/1048576*10)/10} MB</div>
              <div style={{display:'flex',gap:5}}>
                <select className="tagsel" style={{width:56,flex:'none'}}
                        value="" onClick={e=>e.stopPropagation()}
                        onChange={e=>{ if(e.target.value) loadTo(t,e.target.value); }}>
                  <option value="">→ deck</option>
                  <option value="a">A</option>
                  <option value="b">B</option>
                  <option value="c">C</option>
                  <option value="d">D</option>
                </select>
                <select className="tagsel" style={{width:30,flex:'none'}} value=""
                        title="add to crate" onClick={e=>e.stopPropagation()}
                        onChange={e=>{ if(e.target.value) addToCrate(e.target.value, t.id); }}>
                  <option value="">🗂</option>
                  {crates.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
                </select>
                {activeCrate &&
                  <button className="mini" title="remove from this crate"
                          onClick={(e)=>{e.stopPropagation();removeFromCrate(activeCrate,t.id);}}>−</button>}
                <button className="mini" title="remove from library"
                        onClick={(e)=>{e.stopPropagation();removeTrack(t.id);}}>✕</button>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

(async()=>{
  ({DeckLink, MasterClock, LOOKAHEAD_SEC} = await import('./engine/scheduler.js'));
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
})();

// Service worker: only registrable over https:// or http://localhost (the
// platform enforces this — a plain file:// or a bare http:// LAN IP will
// silently have no `serviceWorker` support, or registration will reject).
// This is also the install-eligibility gate: Chromium won't fire
// beforeinstallprompt without a controlling service worker + manifest.
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(err=>{
      console.warn('Service worker registration failed (offline/installability will be unavailable):', err);
    });
  });
}
</script>
</body>
</html>

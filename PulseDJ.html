                       value={volB} onChange={e=>setVolB(parseFloat(e.target.value))}/>
                <Meter getLevel={()=>E.b.level()}/>
              </div>
              <div className="knoblbl" style={{color:'var(--b)'}}>B</div>
            </div>
          </div>

          <div className="mxlabel">CROSSFADER</div>
          <input className="xf" type="range" min="0" max="1" step="0.01"
                 value={xfade} onChange={e=>setXfade(parseFloat(e.target.value))}/>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:9,color:'var(--dim)',fontWeight:700}}>
            <span style={{color:'var(--a)'}}>A</span>
            <button className="mini" onClick={()=>setXfade(0.5)}>CENTER</button>
            <span style={{color:'var(--b)'}}>B</span>
          </div>

          <div className="mxlabel">BEAT MATCH</div>
          <div style={{textAlign:'center',fontSize:11,color:'var(--dim)',fontVariantNumeric:'tabular-nums'}}>
            {E.a.bpm&&E.b.bpm
              ? <span>Δ {Math.abs(E.a.bpm-E.b.bpm).toFixed(1)} BPM</span>
              : <span>load both decks</span>}
          </div>
        </div>

        <DeckPanel deck={E.b} id="B" accent="var(--b)" other={E.a} bump={force} fxItems={fxItems}/>
      </div>

      <div className="lib">
        <div className="libhead">
          <h3>LIBRARY · {lib.length}</h3>
          <input className="search" placeholder="Search title or artist…"
                 value={q} onChange={e=>setQ(e.target.value)}/>
          <div className="tagchips">
            <button className={'chip'+(tagFilter===''?' on':'')} onClick={()=>setTagFilter('')}>ALL</button>
            {FX_TAGS.map(tg=>(
              <button key={tg} className={'chip'+(tagFilter===tg?' on':'')}
                      style={tagFilter===tg?{background:TAG_COLORS[tg],color:'#000',borderColor:TAG_COLORS[tg]}:null}
                      onClick={()=>setTagFilter(tg)}>{tg}</button>
            ))}
          </div>
          <div className="spacer" style={{flex:1}}/>
          <span className="hint">double-click a row to load the free deck</span>
        </div>
        <div className="liblist">
          {shown.length===0 && <div className="empty">
            Drag audio files anywhere in the window, or hit <b>+ ADD TRACKS</b>.<br/>
            Each track is analysed for tempo, beat grid and frequency content on import.
          </div>}
          {shown.map(t=>(
            <div key={t.id} className="lrow"
                 onDoubleClick={()=>loadTo(t, E.a.playing && !E.b.playing ? 'b' : 'a')}>
              <div className="nm"><b>{t.title}</b> <span style={{color:'var(--dim)'}}>— {t.artist}</span></div>
              <select className="tagsel" value={t.tag||''}
                      onClick={e=>e.stopPropagation()}
                      onChange={e=>setTag(t.id, e.target.value)}
                      style={t.tag?{color:'#000',background:TAG_COLORS[t.tag],borderColor:TAG_COLORS[t.tag]}:null}>
                <option value="">— tag —</option>
                {FX_TAGS.map(tg=><option key={tg} value={tg}>{tg}</option>)}
              </select>
              <div className="mu" style={{textAlign:'center',fontSize:'10px',fontWeight:700}}>
                {t.key?`${t.key} ${t.mode?.[0].toUpperCase()}`:'-'}
              </div>
              <div className="mu">{t.bpm.toFixed(1)} BPM</div>
              <div className="mu">{fmtTime(t.duration).split('.')[0]}</div>
              <div className="mu">{Math.round(t.file.size/1048576*10)/10} MB</div>
              <div style={{display:'flex',gap:6}}>
                <button className="mini" style={{color:'var(--a)',borderColor:'#1d3d47'}}
                        onClick={()=>loadTo(t,'a')}>→ A</button>
                <button className="mini" style={{color:'var(--b)',borderColor:'#4a2e18'}}
                        onClick={()=>loadTo(t,'b')}>→ B</button>
                <button className="mini" title="remove from library"
                        onClick={(e)=>{e.stopPropagation();removeTrack(t.id);}}>✕</button>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

(async()=>{
  ({DeckLink, MasterClock, LOOKAHEAD_SEC} = await import('./engine/scheduler.js'));
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
})();

// Service worker: only registrable over https:// or http://localhost (the
// platform enforces this — a plain file:// or a bare http:// LAN IP will
// silently have no `serviceWorker` support, or registration will reject).
// This is also the install-eligibility gate: Chromium won't fire
// beforeinstallprompt without a controlling service worker + manifest.
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(err=>{
      console.warn('Service worker registration failed (offline/installability will be unavailable):', err);
    });
  });
}
</script>
</body>
</html>
